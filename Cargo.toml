[package]
name = "fat"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Local-first personal workout tracker built with Rust and Slint"
license = "MIT"
default-run = "fat"

[lib]
name = "fat"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "fat"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["clock", "serde"] }
dirs = "5.0.1"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
hex = "0.4.3"
rusqlite = { version = "0.32.1", features = ["bundled", "backup"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "backend-android-activity-06", "renderer-software", "compat-1-2"] }
thiserror = "2.0.21"
ureq = { version = "2.12.1", features = ["json", "tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
fontique = { version = "0.11.1", features = ["fontconfig-dlopen"] }

[build-dependencies]
slint-build = "1.18.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[package.metadata.android]
package = "com.himanshu.fat"
apk_name = "fat"
build_targets = ["aarch64-linux-android"]
resources = "android-res"
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "FAT Workout"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"
extract_native_libs = true

[package.metadata.android.application.activity]
orientation = "portrait"
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|uiMode"

# Needed for optional HTTPS update checks and package downloads.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
