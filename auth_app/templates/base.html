<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Auth App</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    input { display: block; width: 100%; margin: 6px 0 12px; padding: 8px; box-sizing: border-box; }
    button { padding: 8px 16px; }
    .flash { background: #eef; border: 1px solid #99c; padding: 8px; margin-bottom: 12px; }
    nav a { margin-right: 12px; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('home') }}">Home</a>
    {% if session.get('user_id') %}
      <a href="{{ url_for('logout') }}">Logout</a>
    {% else %}
      <a href="{{ url_for('login') }}">Login</a>
      <a href="{{ url_for('register') }}">Register</a>
    {% endif %}
  </nav>
  <hr>
  {% for message in get_flashed_messages() %}
    <div class="flash">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
